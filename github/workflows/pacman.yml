name: Generate Pacman Contribution Graph

on:
  # Executa automaticamente todos os dias à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Permite rodar manualmente a qualquer momento pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Pacman Contribution Graph
        uses: Snkrmn/pacman-contribution-graph@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push generated files to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
